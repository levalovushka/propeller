<style>
@font-face {
  font-family: "Inter Variable";
  src: url("assets/InterVariable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; }

/* Всё внутри страницы измеряется в rem от корневого кегля, и он равен
   макетному: 723, 49, 80, 36 попадают в пиксель на любом мониторе. Кегль
   пробовали растить вместе с шириной — на 1512 и 1920 это давало +4…9 px
   ко всему сразу, а окно внизу за это платило обрезкой. Ширина экрана здесь
   ничего не значит: макет держит колонка, а не вьюпорт. */
:root {
  font-size: 16px;
  --ink: rgba(255, 255, 255, 0.95);
  --ink-dim: rgba(255, 255, 255, 0.55);
  --radius: 0.5rem;
  /* Ступень ховера всего приложения — `Tokens.Motion.Step.t120`. */
  --t-hover: 0.12s;
}

html, body { height: 100%; }

body {
  margin: 0;
  font-family: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-weight: 400;
  color: var(--ink);
  background: #0a0a0a;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Один экран: превью уходит под нижний край, и это единственное, что обрезано. */
.page {
  position: relative;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
}

/* Вотермарк стока вырезан из самого файла, а не спрятан кадрированием:
   приближение приходилось пересчитывать под каждую ширину, и на 1920 надпись
   возвращалась. Срезана верхняя полоса (2048×1552 → 2048×1252, надпись стояла
   в правом верхнем углу) — правый край снимка при этом остался целым. Резать
   его по ширине оказалось нельзя: к краям выходили тёмные участки, и на
   широком мониторе фотография переставала доставать до бортов. */
.page::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background: #0a0a0a url("assets/bg.jpg") center / cover no-repeat;
}

/* Затемнение из макета. Снизу добавлено чуть больше — под превью фотография
   светлеет, и без этого тень окна тонула в фактуре. */
.page::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    /* Текст стоит слева-сверху, а фотография ровно там временами уходит в
       светлое — затемнение идёт по диагонали от него, а не ровным слоем:
       ровный пришлось бы гнать до 0.5, и от снимка осталась бы серая плита. */
    radial-gradient(120% 100% at 12% 22%, rgba(0,0,0,0.55), rgba(0,0,0,0) 62%),
    linear-gradient(to bottom, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%),
    rgba(0, 0, 0, 0.2);
}

.container {
  width: 45.1875rem;      /* 723 / 16 */
  max-width: calc(100% - 2rem);
  margin: 0 auto;
  /* Вертикальный ритм макета — 33 и 80 — снят с экрана 1024×664. Ширина здесь
     ни при чём: те же числа на мониторе 1440×900 уводят окно целиком под
     нижний край. Поэтому по вертикали шаг считается от высоты вьюпорта и
     упирается в макетный потолок. */
  padding-top: clamp(1.25rem, 5vh, 2.0625rem);
  display: flex;
  flex-direction: column;
  /* Единственный зазор между условиями и окном. Было 0.25rem — четыре пикселя
     читались как слипшиеся, строка «macOS 14.4 и новее» садилась на верхнюю
     грань окна. Восемь — минимум, при котором она снова подпись к кнопке
     сверху, а не к окну снизу. */
  gap: 0.5rem;
  height: 100%;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: clamp(1.75rem, 7.5vh, 5rem); /* 80 */
  padding-inline: 3.0625rem;        /* 49 */
}

/* Шапка */

.masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 0.5rem;
}

/* Знак без подписи: имя уже стоит в <title> и в первом экране, а в шапке
   надпись только повторяла его. Высота ведущая, ширина следует за рисунком —
   он 623.6 × 695.4, не квадрат. */
.mark { display: block; height: 2rem; width: auto; }

.links { display: flex; align-items: center; gap: 0.5rem; }

.links a {
  display: inline-flex;
  align-items: center;
  height: 2.25rem;
  padding: 0.5rem 0.625rem;
  border-radius: var(--radius);
  color: #fff;
  font-size: 0.875rem;
  line-height: 1.125rem;
  text-decoration: none;
  transition: background-color var(--t-hover) ease-out;
}

.links a:hover { background: rgba(255, 255, 255, 0.12); }

/* Герой */

.hero { display: flex; flex-direction: column; gap: 1.75rem; align-items: flex-start; }

.copy { display: flex; flex-direction: column; gap: 1.25rem; }

h1 {
  margin: 0;
  font-size: 2.25rem;
  line-height: 2.5rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

/* Две строки заголовка — решение макета, а не следствие ширины: перенос стоит
   между предложениями. На телефоне строки снова становятся текстом и ломаются
   там, где придётся, поэтому пробел между ними в разметке настоящий. */
h1 span { display: block; }

.sub {
  margin: 0;
  max-width: 36.9375rem; /* 591 */
  font-size: 1rem;
  line-height: 1.375rem;
}

.download {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius);
  background: #fff;
  color: #000;
  font-size: 1rem;
  line-height: 1.375rem;
  text-decoration: none;
  /* Кнопка не подпрыгивает и не отбрасывает тень: в приложении ховер — это
     смена цвета за 0.12 с и ничего больше, а нажатие отвечает быстрее, чем
     палец успевает почувствовать лаг (`Step.t60`). */
  transition: background-color var(--t-hover) ease-out;
}

.download:hover { background: rgba(255, 255, 255, 0.88); }
.download:active { background: rgba(255, 255, 255, 0.76); transition-duration: 0.06s; }

.terms {
  /* Снизу отступа нет: условия — подпись к кнопке, а не к окну под ними. */
  padding-top: 0.75rem;
  font-size: 1rem;
  line-height: 1.375rem;
  color: var(--ink-dim);
}

.terms p { margin: 0; }

/* Превью */

/* Окно показывается целиком по ширине и обрезается нижним краем экрана — то
   есть ровно тем, чем оно обрезано в макете. Пропорция не задаётся: кадр
   приходит из галереи приложения (1880×1400), и раму под него подгонять
   нечем — она и есть он. */
.preview {
  width: 100%;
  border-radius: 0.75rem 0.75rem 0 0;
  overflow: hidden;
  /* Волосяная грань поверх тени: окно тёмное, фотография под ним в этом месте
     тоже уходит в чёрное, и без неё верхний край окна пропадал вовсе. */
  box-shadow:
    0 1rem 7.5rem rgba(0, 0, 0, 0.4),
    0 1.25rem 4rem rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.preview img { display: block; width: 100%; height: auto; }

/* Телефон: страница перестаёт быть одним экраном — там ничего не скачивают,
   там решают, стоит ли открыть с мака вечером. */
@media (max-width: 720px) {
  .page { height: auto; }

  .container {
    width: 100%;
    max-width: none;
    padding: 1.25rem 0 0;
    gap: 1.25rem;
    height: auto;
  }

  .stack { gap: 2.25rem; padding-inline: 1.25rem; }

  /* Разбивка на две строки нарисована под ширину десктопа; на 375 pt она
     ставит переносы в середине фразы. Здесь текст ломается сам. */
  h1 { font-size: 1.5rem; line-height: 1.875rem; }
  h1 span { display: inline; }

  .sub { font-size: 1rem; line-height: 1.375rem; }

  .terms { padding-bottom: 0; }

  /* Целиком окно на телефоне нечитаемо — остаётся картинка «какой-то тёмный
     интерфейс». Кадр приближен и сдвинут влево: в экран попадает колонка
     конспекта, то есть ровно то, ради чего сюда пришли. */
  .preview {
    margin-left: 1.25rem;
    margin-right: 0;
    width: auto;
    border-radius: 0.625rem 0 0 0;
  }

  /* Ровно колонка конспекта: левый рельс уходит за левый край, а правый край
     окна ложится на правый край экрана — отсюда 146 и 46, они дают ровно 100. */
  .preview img { width: 146%; margin-left: -46%; }
}

/* Появление
   ----------
   Страница приходит один раз, по порядку чтения: заголовок → подзаголовок →
   кнопка → условия → окно. Шаг между ними — 0.06 с (`Motion.Step.t60`),
   длительность — 0.24 с (`t240`, ступень «приход содержимого»); окну дано
   чуть больше, потому что и путь у него длиннее.
   Вордмарк и ссылки не двигаются: они не содержание, а рамка страницы, и
   мигающая шапка читается как перезагрузка. */
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

h1, .sub, .download, .terms, .preview {
  animation: rise 0.24s ease-out backwards;
}

h1        { animation-delay: 0s; }
.sub      { animation-delay: 0.06s; }
.download { animation-delay: 0.12s; }
.terms    { animation-delay: 0.18s; }

.preview {
  animation-duration: 0.34s;
  animation-delay: 0.16s;
  animation-name: rise-window;
}

@keyframes rise-window {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

    </div>

</main>
