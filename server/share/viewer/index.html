<title>Propeller</title>

<style>
/* Страница саммари.
 *
 * Держит две верности сразу. Типографика и ритм — панели встречи
 * (Figma 312:11129, числа из `Tokens.Pane`): мера 569, поля 40, имя 22/24,
 * тело 13/22, тихий заголовок раздела 12/14, разрыв раздела 36, между
 * абзацами 20, маркеров у пунктов нет. Земля, гарнитура и ховер — лендингу
 * `site/index.html`: `#0a0a0a`, Inter, 0.12 с, — иначе человек, пришедший
 * с propeller.report, попадает к незнакомцу.
 *
 * Два отступления, названные вслух, а не сделанные молча:
 *
 * 1. Тихий текст здесь **светлее**, чем в приложении (52 % против 30 %).
 *    30 % сняты для 12 pt на маке за столом; эту страницу открывают с
 *    телефона и на солнце, и там 30 % дают контраст 2,6:1 — заголовок
 *    раздела перестаёт читаться. 52 % дают 5,7:1 и остаются вдвое тише тела.
 * 2. На узком экране растёт корневой кегль, а не отдельные размеры: система
 *    масштабируется целиком, и ни одно число из макета не переписывается.
 *
 * Плашек нет ни одной (PR-005), линеек-разделителей тоже: иерархия —
 * расстоянием и типографикой. Шапки с логотипом нет намеренно: читатель
 * пришёл за саммари, а не за нами, и знак стоит в подписи под текстом —
 * там, где его увидит тот, кто дочитал.
 */

@font-face {
  font-family: "Inter Variable";
  src: url("/assets/InterVariable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

:root {
  font-size: 16px;

  --bg: #0a0a0a;
  --ink: rgba(255, 255, 255, 0.95);
  --text: rgba(255, 255, 255, 0.90);
  --quiet: rgba(255, 255, 255, 0.52);
  --selection: rgba(255, 255, 255, 0.16);

  /* Ступень ховера всего приложения — `Tokens.Motion.Step.t120`. */
  --t-hover: 0.12s;
  /* Приход — `Step.t180`, `easeOut`. `easeIn` не бывает нигде. */
  --t-enter: 0.18s;
}

@media (prefers-color-scheme: light) {
  :root {
    /* Светлые значения выведены, а не нарисованы: `#F5F5F5` — светлый
     * близнец `#0A0A0A` из `Tokens.Primitive`, чернила — его пары. */
    --bg: #f5f5f5;
    --ink: rgba(0, 0, 0, 0.92);
    --text: rgba(0, 0, 0, 0.88);
    --quiet: rgba(0, 0, 0, 0.58);
    --selection: rgba(0, 0, 0, 0.12);
  }
}

*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-weight: 400;
  font-size: 0.8125rem;    /* 13 */
  line-height: 1.375rem;   /* 22 */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--selection); }

main {
  max-width: 40.5625rem;   /* 649 = мера 569 + поля 40·2 */
  margin: 0 auto;
  padding: 2rem 2.5rem 2.5rem;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* Голова: строка атрибутов → имя встречи → первый абзац, один шаг 16 на оба
   стыка. Ровно как в панели. */

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.875rem;           /* 14 */
  margin: 0 0 1rem;
  font-size: 0.75rem;      /* 12 */
  line-height: 1rem;
  color: var(--ink);
  /* Время — показание прибора: цифры одной ширины, чтобы «16:30» читалось
     как отсчёт, а не как слово. */
  font-variant-numeric: tabular-nums;
}

h1 {
  margin: 0 0 1rem;
  font-size: 1.375rem;     /* 22 */
  line-height: 1.5rem;     /* 24 */
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--ink);
  text-wrap: pretty;
}

.block { margin: 0 0 1.25rem; }   /* 20 */

/* Заголовок раздела — тихая подпись, а не титул. 36 сверху: разрыв раздела —
   самая громкая тишина на странице теперь, когда сами заголовки замолчали. */
.heading {
  margin: 2.25rem 0 0.5rem;
  font-size: 0.75rem;      /* 12 */
  line-height: 0.875rem;   /* 14 */
  color: var(--quiet);
}
.heading:first-child { margin-top: 0; }

article > :last-child { margin-bottom: 0; }

strong { font-weight: 600; }
em { font-style: italic; }

/* Состояние занимает место саммари и говорит, как есть: что произошло и что
   будет дальше. Слов-просьб здесь нет — ни «повторите», ни «проверьте»:
   всё, что страница умеет сделать сама, она делает сама.
   Цвет обычный, а не тихий: на такой странице это единственный текст, и
   глушить его — глушить всё, что у читателя есть (PR-006). Тише говорит
   только «Открываю…»: оно про сейчас, а не про то, что случилось. */
.state { margin: 0; color: var(--text); }
.state.transient { color: var(--quiet); }

/* Подпись. Знак — не кнопка и не выглядит ею (PR-013): нажимается слово. */

/* Подпись стоит на постоянном расстоянии от текста, а не у нижней кромки
   экрана. Пробовали кромку (`margin-top: auto`) — так подпись читается как
   хром страницы, а она про текст над собой: кто собрал это саммари. Зазор
   постоянный — значит, это подпись, а зазор переменный — значит, подвал. */
footer {
  margin-top: 4rem;
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
}

.mark {
  flex: none;
  height: 1.5rem;
  width: auto;
  color: var(--quiet);
  margin-top: 0.0625rem;
}

.origin { margin: 0; font-size: 0.75rem; line-height: 1.125rem; }
.origin a {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--quiet);
  transition: border-color var(--t-hover) ease-out;
}
.origin a:hover { border-bottom-color: var(--ink); }
.origin .note, .origin .life { display: block; color: var(--quiet); }
.origin .life { margin-top: 0.375rem; font-variant-numeric: tabular-nums; }

/* Приход: текст проступает, ничего не едет. Прозрачность не укачивает и
   остаётся даже при «уменьшить движение». */
.enter { animation: enter var(--t-enter) ease-out both; }
@keyframes enter { from { opacity: 0 } to { opacity: 1 } }

/* Телефон: растёт корневой кегль — вместе с ним вся система, а числа макета
   остаются числами макета. */
@media (max-width: 35rem) {
  :root { font-size: 18px; }
  main { padding: 1.5rem 1.25rem 2rem; }
  footer { margin-top: 3rem; }
}

/* Саммари печатают и кладут в PDF: страница обязана это пережить. */
@media print {
  :root {
    --bg: #fff;
    --ink: #000;
    --text: #1a1a1a;
    --quiet: #595959;
  }
  main { max-width: none; min-height: 0; padding: 0; }
  footer { margin-top: 2rem; }
  .origin a { border: 0; }
  .heading { break-after: avoid; }
  .block { break-inside: avoid; }
}
</style>
</head>
<body>
<main>
  <article id="doc" hidden></article>
  <p class="state" id="state" hidden></p>

  <footer>

    <p class="origin">
      <a href="https://propeller.report/">Propeller</a>
      <span class="note">Записи и&nbsp;саммари встреч. Бесплатно, локально, на&nbsp;русском.</span>
      <span class="life" id="life" hidden></span>
    </p>
  </footer>
</main>

<script>
// Ключ приходит во фрагменте ссылки и на сервер не уходит: браузер не
// отправляет всё, что после «#». Поэтому расшифровка целиком здесь, а сервер
// знает только байты. Без JS страница не откроется — осознанный размен
// в пользу того, что сервер не видит содержимого (SERVER.md §3.4).

const doc = document.getElementById('doc');
const stateLine = document.getElementById('state');
const lifeLine = document.getElementById('life');

// Строки собраны в одном месте, а не разложены по ветвям: копирайт живёт
// там, где его можно прочитать целиком и увидеть, что он говорит одним
// голосом. Неразрывные пробелы — после однобуквенных предлогов.
const SAY = {
  opening: 'Открываю…',
  noKey:
    'У ссылки потерялся хвост после «#» — без него саммари не прочитать. ' +
    'Целая ссылка есть у\u00A0того, кто её прислал.',
  gone: 'Ссылки больше нет: её отозвали или у\u00A0неё вышел срок.',
  wrongKey: 'Ключ в\u00A0ссылке не подходит к\u00A0этому саммари.',
  newer: 'Эту ссылку сделала более новая версия Propeller.',
  offline:
    'Связи с\u00A0сервером нет. Страница откроется сама, когда связь вернётся.',
};

function say(text, transient = false) {
  doc.hidden = true;
  stateLine.textContent = text;
  stateLine.classList.toggle('transient', transient);
  stateLine.hidden = false;
  stateLine.classList.add('enter');
}

function base64urlToBytes(s) {
  const pad = s.length % 4 === 0 ? '' : '='.repeat(4 - (s.length % 4));
  const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + pad);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// Во фрагменте живёт и слаг для глаза: «#vstrecha-s-daney&k=…». Читается он
// только человеком — искать нужно именно «k=», а не первый кусок.
function keyFromHash() {
  const hash = location.hash.replace(/^#/, '');
  for (const part of hash.split('&')) {
    if (part.startsWith('k=')) return part.slice(2);
  }
  return '';
}

function idFromPath() {
  const m = location.pathname.match(/^\/s\/([A-Za-z0-9_-]{22})$/);
  return m ? m[1] : '';
}

// Сырой DEFLATE, не gzip: приложение сжимает через `COMPRESSION_ZLIB`, а это
// у Apple означает именно RFC 1951 без обёртки. Заголовок и CRC gzip'а
// пришлось бы собирать в Swift руками ради того же результата.
async function inflate(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(stream).text();
}

// Ссылка временная, и читатель имеет право знать об этом до того, как
// положит её в закладки. Год появляется, только если он не нынешний, — то же
// правило, что у даты встречи в приложении (`MeetingMeta.when`).
function showLifetime(unixSeconds) {
  const when = new Date(Number(unixSeconds) * 1000);
  if (Number.isNaN(when.getTime())) return;
  const sameYear = when.getFullYear() === new Date().getFullYear();
  const date = new Intl.DateTimeFormat('ru-RU', {
    day: 'numeric', month: 'long', ...(sameYear ? {} : { year: 'numeric' }),
  }).format(when);
  lifeLine.textContent = 'Ссылка исчезнет ' + date + '.';
  lifeLine.hidden = false;
}

function render(payload) {
  doc.textContent = '';

  if (Array.isArray(payload.meta) && payload.meta.length) {
    const row = document.createElement('div');
    row.className = 'meta';
    for (const chip of payload.meta) {
      const span = document.createElement('span');
      span.textContent = chip;
      row.appendChild(span);
    }
    doc.appendChild(row);
  }

  if (payload.title) {
    const h = document.createElement('h1');
    h.textContent = payload.title;
    doc.appendChild(h);
    document.title = payload.title + ' — Propeller';
  }

  for (const block of payload.blocks || []) {
    const el = document.createElement('p');
    // Пункт списка и абзац рисуются одинаково: разница живёт в markdown,
    // а не на экране. `lead` тоже давно перестал быть своим лицом.
    el.className = block.kind === 'heading' ? 'heading' : 'block';
    for (const span of block.spans || []) {
      let node = document.createTextNode(span.text || '');
      if (span.italic) { const em = document.createElement('em'); em.appendChild(node); node = em; }
      if (span.bold) { const st = document.createElement('strong'); st.appendChild(node); node = st; }
      el.appendChild(node);
    }
    doc.appendChild(el);
  }

  stateLine.hidden = true;
  doc.hidden = false;
  doc.classList.add('enter');
}

// Сеть отвечает не всегда с первого раза, и просить об этом читателя нечего:
// лестница своя. Быстрая часть конечна — человек ждёт с открытой страницей, и
// вечно молчать в неё нельзя (`principles.md` §10). Дальше страница ждёт
// сигнала — возвращения связи, — а таймер остаётся страховкой, а не
// стратегией. Кнопки «Повторить» нет и не будет (§3).
const FAST_LADDER = [500, 2000, 5000];
const SLOW_RETRY = 15000;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function fetchBlob(id) {
  for (let attempt = 0; ; attempt++) {
    try {
      const res = await fetch('/api/blob/' + id, { cache: 'no-store', referrerPolicy: 'no-referrer' });
      // Нет, протухло и отозвано отвечают одинаково — и здесь тоже говорятся
      // одной фразой: сервер не сообщает, что именно случилось, и страница
      // не догадывается за него.
      if (res.status === 404) return { gone: true };
      if (res.ok) {
        return {
          blob: new Uint8Array(await res.arrayBuffer()),
          expires: res.headers.get('X-Share-Expires'),
        };
      }
      // 429 и пятисотые — это «сейчас нет», а не «нет»: та же лестница.
    } catch (e) {
      // Сеть оборвалась. Тоже «сейчас нет».
    }

    if (attempt < FAST_LADDER.length) {
      await sleep(FAST_LADDER[attempt]);
      continue;
    }
    say(SAY.offline);
    await Promise.race([
      sleep(SLOW_RETRY),
      new Promise((r) => addEventListener('online', r, { once: true })),
    ]);
  }
}

async function openShare() {
  const id = idFromPath();
  const key = keyFromHash();
  if (!id || !key) {
    say(SAY.noKey);
    return;
  }

  // Строка «Открываю…» появляется только если открытие затянулось: почти
  // всегда саммари успевает прийти раньше, и мигать ею незачем.
  const opening = setTimeout(() => say(SAY.opening, true), 200);

  const answer = await fetchBlob(id);
  clearTimeout(opening);
  if (answer.gone) { say(SAY.gone); return; }

  try {
    const raw = base64urlToBytes(key);
    const nonce = answer.blob.slice(0, 12);
    const sealed = answer.blob.slice(12);
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, k, sealed);
    const payload = JSON.parse(await inflate(new Uint8Array(plain)));
    if (payload.v !== 1) { say(SAY.newer); return; }
    render(payload);
    if (answer.expires) showLifetime(answer.expires);
  } catch (e) {
    say(SAY.wrongKey);
  }
}

openShare();
</script>
</body>
</html>
